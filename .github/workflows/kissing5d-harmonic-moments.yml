name: kissing5d-harmonic-moments

on:
  push:
    branches:
      - kissing5d-compute
    paths:
      - '.github/workflows/kissing5d-harmonic-moments.yml'

jobs:
  moments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compute Gegenbauer moments
        shell: bash
        run: |
          python -m pip install -q numpy
          for N in 41 42 43 44; do curl -Ls "https://neilsloane.com/packings/dim5/pack.5.$N.txt" -o "/tmp/pack.5.$N.txt"; done
          python - <<'PY'
          import numpy as np, itertools

          def gegenbauer_normalized(t,K=14):
              P=[np.ones_like(t), np.array(t,float)]
              for k in range(1,K):
                  P.append(((2*k+3)/(k+3))*t*P[k] - (k/(k+3))*P[k-1])
              return P[:K+1]

          def report(name,x):
              x=np.asarray(x,float)
              x=x/np.linalg.norm(x,axis=1,keepdims=True)
              G=x@x.T
              P=gegenbauer_normalized(G,14)
              vals=G[np.triu_indices(len(x),1)]
              print('\n===',name,'N',len(x),'maxip',float(vals.max()),'angle',float(np.degrees(np.arccos(vals.max()))),'===')
              for k,p in enumerate(P):
                  S=float(p.sum())
                  print(f'K={k:2d} S={S:.15g} S/N={S/len(x):.15g} S/N2={S/len(x)**2:.15g}')
              print('centroid_norm2=',float(np.linalg.norm(x.sum(axis=0))**2))

          # Exact D5 kissing configuration: roots (±1,±1,0,0,0)/sqrt(2)
          roots=[]
          for a,b in itertools.combinations(range(5),2):
              for sa in (-1,1):
                  for sb in (-1,1):
                      v=np.zeros(5); v[a]=sa; v[b]=sb; roots.append(v/np.sqrt(2))
          report('D5_EXACT_40',np.array(roots))
          for N in (41,42,43,44):
              x=np.loadtxt(f'/tmp/pack.5.{N}.txt').reshape(-1,5)
              report(f'SLOANE_{N}',x)
          PY
