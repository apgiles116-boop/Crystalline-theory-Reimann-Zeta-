name: kissing5d-fetch-lasserre-data

on:
  push:
    branches:
      - kissing5d-compute
    paths:
      - '.github/workflows/kissing5d-fetch-lasserre-data.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect released LAS2 implementation
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://data.4tu.nl/ndownloader/items/74ce1c25-6fca-4680-8a36-e9c18e7e9594/versions/1'
          curl -L "$URL" -o /tmp/outer.zip
          rm -rf /tmp/outer /tmp/lasserre
          mkdir /tmp/outer /tmp/lasserre
          unzip -q /tmp/outer.zip -d /tmp/outer
          unzip -q /tmp/outer/LasserreSphericalCodes.zip -d /tmp/lasserre
          ROOT=/tmp/lasserre/LasserreSphericalCodes
          echo '===== Project.toml ====='
          cat "$ROOT/Project.toml"
          echo '===== proof metadata ====='
          find "$ROOT" -path '*/proofs/*/metadata.txt' -print -exec sh -c 'echo --- $1; cat "$1"' _ {} \; || true
          echo '===== las2.jl 1-280 ====='
          sed -n '1,280p' "$ROOT/src/las2.jl"
          echo '===== las2.jl 580-740 ====='
          sed -n '580,740p' "$ROOT/src/las2.jl"
          echo '===== las2.jl 740-840 ====='
          sed -n '740,840p' "$ROOT/src/las2.jl"
          echo '===== obj references ====='
          grep -nE '\bobj\b|Objective\(|objective' "$ROOT/src/las2.jl" | head -150
