name: kissing5d-shell-structure

on:
  push:
    branches:
      - kissing5d-compute
    paths:
      - '.github/workflows/kissing5d-shell-structure.yml'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analyze 35+6 decomposition
        shell: bash
        run: |
          python -m pip install -q numpy
          curl -Ls 'https://neilsloane.com/packings/dim5/pack.5.41.txt' -o /tmp/pack.5.41.txt
          python - <<'PY'
          import numpy as np
          from collections import Counter
          x=np.loadtxt('/tmp/pack.5.41.txt').reshape(-1,5)
          x=x/np.linalg.norm(x,axis=1,keepdims=True)
          G=x@x.T
          shell=[5,6,7,11,34,40]
          core=[i for i in range(41) if i not in shell]
          S=x[shell]; C=x[core]
          GS=S@S.T
          off=GS[np.triu_indices(6,1)]
          print('SHELL_GRAM=')
          for r in GS: print(' '.join(f'{z:.15f}' for z in r))
          print('SHELL_OFF_SORTED=',sorted(map(float,off)))
          print('SHELL_OFF_MEAN=',float(off.mean()),'STD=',float(off.std()),'MIN=',float(off.min()),'MAX=',float(off.max()))
          print('SHELL_CENTROID_NORM=',float(np.linalg.norm(S.sum(axis=0))))
          print('SHELL_GRAM_EIG=',np.linalg.eigvalsh(GS).tolist())
          # compare to regular 5-simplex Gram (diag 1, off -1/5)
          J=np.full((6,6),-0.2); np.fill_diagonal(J,1.0)
          print('DIST_TO_SIMPLEX_FROB=',float(np.linalg.norm(GS-J)))
          # Core exposure to each shell point
          X=C@S.T
          for k,idx in enumerate(shell):
              v=np.sort(X[:,k])[::-1]
              print(f'SHELL_VERTEX {idx} max={v[0]:.15f} top10={v[:10].tolist()} count_gt_0.5={int((v>0.5).sum())} count_gt_0.49={int((v>0.49).sum())} count_gt_0.48={int((v>0.48).sum())}')
          # Each core point signature against shell
          signatures=[]
          for a,idx in enumerate(core):
              row=np.sort(X[a])[::-1]
              signatures.append((float(row[0]), idx, row.tolist()))
          signatures.sort(reverse=True)
          print('CORE_SHELL_MAX_RANKING=')
          for m,idx,row in signatures:
              print(idx, f'{m:.15f}', row)
          # shell polar-coordinate barycentric diagnostic: simplex frame coefficients
          # If shell is close to simplex, sum inner products with shell should be close to 0.
          sums=X.sum(axis=1)
          print('CORE_SUM_IP_TO_SHELL min max mean std=',float(sums.min()),float(sums.max()),float(sums.mean()),float(sums.std()))
          print('CORE_SUM_IP_VALUES=',[(core[i],float(sums[i])) for i in np.argsort(sums)])
          # covariance / tight-frame test
          M=S.T@S
          print('SHELL_FRAME_OPERATOR_EIG=',np.linalg.eigvalsh(M).tolist())
          print('SHELL_FRAME_OPERATOR=',M.tolist())
          PY
