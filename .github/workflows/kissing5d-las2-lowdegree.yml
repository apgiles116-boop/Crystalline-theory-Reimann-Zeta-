name: kissing5d-las2-lowdegree

on:
  push:
    branches:
      - kissing5d-compute
    paths:
      - '.github/workflows/kissing5d-las2-lowdegree.yml'

jobs:
  las2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Download released LAS2 package
        shell: bash
        run: |
          set -euxo pipefail
          curl -L 'https://data.4tu.nl/ndownloader/items/74ce1c25-6fca-4680-8a36-e9c18e7e9594/versions/1' -o /tmp/outer.zip
          mkdir -p /tmp/outer /tmp/lasserre
          unzip -q /tmp/outer.zip -d /tmp/outer
          unzip -q /tmp/outer/LasserreSphericalCodes.zip -d /tmp/lasserre
      - name: Instantiate package
        shell: bash
        run: |
          ROOT=/tmp/lasserre/LasserreSphericalCodes
          julia --project="$ROOT" -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Run 5D LAS2 degree 4
        shell: bash
        run: |
          ROOT=/tmp/lasserre/LasserreSphericalCodes
          julia --project="$ROOT" -t 2 -e 'using LasserreSphericalCodes, ClusteredLowRankSolver; println("LAS2_BEGIN n=5 d1=4 delta=4 d2=4"); o,p,ps,ds=las2(5,[-1,1//2],4;delta=4,d2=4); println("LAS2_RETURNED_OBJ=",o); println("LAS2_PRIMAL=",objvalue(p,ps)); println("LAS2_DUAL=",dualobjvalue(p,ds)); println("LAS2_END")'
