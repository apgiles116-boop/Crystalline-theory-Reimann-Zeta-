[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crystalline-zeta"
version = "0.1.0"
description = "Exploratory crystalline and finite-gap experiments for Riemann-zeta simple-zero bounds"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
